nameOverrides:
  release: null # global fullname
  configmap: null
  crowdsecMachineCredentialsSecret: null
  deployment: null
  port: null

image:
  name: docker-registry.timtrense.com/tim/prometheus-crowdsec-exporter
  tag: null
  pullPolicy: IfNotPresent
  pullSecrets: []

podSecurityContext: {}
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 8001

# Additional declarations
labels: {}
annotations: {}
podAnnotations: {}
podLabels: {}
resources: {}
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: null # default 5
extraEnv: []

# can be used with .nameOverrides.crowdsecMachineCredentialsSecret to use an existing secret instead of creating a new one
useExistingMachineCredentialsSecret: false

config:
  lapi_url: "http://crowdsec-lapi:8080"
  lapi_http_timeout_seconds: null # default 10
  bind_host: null # default "0.0.0.0"
  log_level: null # default "info"
  retain_counter_startup_increment: null # default false
  counter_max_count: null # default 10000
  counter_max_age_seconds: null # default 300

  # required
  machine_id: null
  machine_password: null
