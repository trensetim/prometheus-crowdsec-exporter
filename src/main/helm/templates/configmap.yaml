apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "configmap-name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.configMap.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.configMap.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
data:
  lapi_url: {{ .Values.config.lapi_url | quote }}
  bind_port: {{ include "port-number" . | quote }}
  bind_host: {{ .Values.config.bind_host | default "0.0.0.0" | quote }}
  log_level: {{ .Values.config.log_level | default "info" | quote }}
  lapi_http_timeout_seconds: {{ .Values.config.lapi_http_timeout_seconds | default 10 | quote }}
  lapi_batch_size: {{ .Values.config.lapi_batch_size | default 1000 | quote }}
  retain_counter_startup_increment: {{ .Values.config.retain_counter_startup_increment | default false | quote }}
  counter_max_count: {{ .Values.config.counter_max_count | default 10000 | quote }}
  counter_max_age_seconds: {{ .Values.config.counter_max_age_seconds | default 300 | quote }}
  alert_dedup_window_size: {{ .Values.config.alert_dedup_window_size | default 50000 | quote }}
  {{- if kindIs "slice" .Values.config.metric_sets }}
  metric_sets: {{ join "," .Values.config.metric_sets }}
  {{- else }}
  metric_sets: {{ .Values.config.metric_sets | quote }}
  {{- end }}
