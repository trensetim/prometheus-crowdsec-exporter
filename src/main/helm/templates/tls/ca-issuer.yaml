{{- if and
    .Values.tls.enabled
    .Values.tls.certManager.enabled
    .Values.tls.certManager.issuer.enabled
    .Values.tls.certManager.issuer.caCertificate.enabled
    .Values.tls.certManager.issuer.caCertificate.issuer.enabled
}}
apiVersion: cert-manager.io/v1
kind: {{ .Values.tls.certManager.issuer.caCertificate.issuer.kind }}
metadata:
  name: {{ include "certmanager-cacertificate-issuer-name" . | quote }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.tls.certManager.issuer.caCertificate.issuer.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.tls.certManager.issuer.caCertificate.issuer.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec: {{- toYaml .Values.tls.certManager.issuer.caCertificate.issuer.spec | nindent 2 }}
{{- end }}
