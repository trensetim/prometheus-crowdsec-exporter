{{- if and .Values.tls.enabled .Values.tls.explicitSecret.enabled -}}

{{- if or (empty .Values.tls.explicitSecret.cert_b64_pem) (empty .Values.tls.explicitSecret.key_b64_pem) -}}
{{- fail "Both tls.explicitSecret.cert_b64_pem and tls.explicitSecret.key_b64_pem must be provided" -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tls-secret-name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.tls.secret.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.tls.secret.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.explicitSecret.cert_b64_pem | quote }}
  tls.key: {{ .Values.tls.explicitSecret.key_b64_pem | quote }}

{{- end -}}
