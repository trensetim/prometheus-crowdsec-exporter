{{- if and .Values.tls.enabled .Values.tls.certManager.enabled .Values.tls.certManager.issuer.enabled }}
apiVersion: cert-manager.io/v1
kind: {{ .Values.tls.certManager.issuer.kind }}
metadata:
  name: {{ include "certmanager-issuer-name" . | quote }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.tls.certManager.issuer.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.tls.certManager.issuer.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ca:
    secretName: {{ include "certmanager-cacertificate-name" . | quote }}
{{- end }}
