{{- if .Values.tls.enabled -}}

{{- if and .Values.tls.certManager.enabled .Values.tls.explicitSecret.enabled -}}
{{- fail "tls.certManager.enabled and tls.explicitSecret.enabled are mutually exclusive" -}}
{{- end -}}

{{- if and (empty .Values.tls.certManager.enabled) (empty .Values.tls.explicitSecret.enabled) -}}
{{- fail "If .tls.enabled is true, either .tls.certManager.enabled or .tls.explicitSecret.enabled must be true" -}}
{{- end -}}

{{- end -}}
