{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dashboard-configmap-name" . }}
  {{- with .Values.dashboard.configMap.namespace }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.dashboard.configMap.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.dashboard.configMap.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
data:
  {{ .Values.dashboard.configMap.fileName | quote }}: |- {{- .Files.Get "dashboard.json" | nindent 4 }}
{{- end -}}
