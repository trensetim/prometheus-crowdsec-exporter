{{ if .Values.prometheus.prometheusRule.enabled }}

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ default (include "name" .) .Values.prometheus.prometheusRule.name }}
  {{- with .Values.prometheus.prometheusRule.namespace }}
  namespace: {{ . | default .Release.Namespace }}
  {{- end }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.prometheus.prometheusRule.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.prometheus.prometheusRule.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  groups:
    - name: {{ default (printf "%s@%s" (include "name" .) .Release.Namespace) .Values.prometheus.prometheusRule.groupName }}
      rules: {{- toYaml .Values.prometheus.prometheusRule.rules | nindent 8 }}
{{ end }}
