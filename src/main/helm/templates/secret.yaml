{{ if not .Values.useExistingMachineCredentialsSecret -}}

{{- if not .Values.config.machine_id }}
  {{- fail "config.machine_id must be set" }}
{{- end }}
{{- if not .Values.config.machine_password }}
  {{- fail "config.machine_password must be set" }}
{{- end -}}


apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ include "name" . }}-machine-credentials
  labels:
    {{- include "labels" . | nindent 4 }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
stringData:
  username: {{ .Values.config.machine_id | quote }}
  password: {{ .Values.config.machine_password | quote }}

{{- end }}
