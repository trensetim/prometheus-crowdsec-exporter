{{ if .Values.config.machineCredentials.secret.enabled -}}

{{- if not .Values.config.machineCredentials.id }}
  {{- fail "config.machineCredentials.id must be set" }}
{{- end }}
{{- if not .Values.config.machineCredentials.password }}
  {{- fail "config.machineCredentials.password must be set" }}
{{- end -}}


apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: {{ include "machine-credentials-secret-name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.config.machineCredentials.secret.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.config.machineCredentials.secret.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
stringData:
  username: {{ .Values.config.machineCredentials.id | quote }}
  password: {{ .Values.config.machineCredentials.password | quote }}

{{- end }}
