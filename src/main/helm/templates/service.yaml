apiVersion: v1
kind: Service
metadata:
  name: {{ include "name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ include "port-name" . }}
      protocol: TCP
      name: {{ include "port-name" . }}
  selector:
    {{- include "selectorLabels" . | nindent 4 }}
