apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name | default (include "name" .) }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.deployment.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.deployment.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "annotations" . | nindent 8 }}
        {{- range $key, $value := .Values.pod.annotations }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      labels:
        {{- include "labels" . | nindent 8 }}
        {{- range $key, $value := .Values.pod.labels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds | default 5 }}
      containers:
        - name: exporter
          {{- with .Values.pod.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ include "port-name" . }}
              containerPort: {{ include "port-number" . }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: {{ include "port-name" . }}
              scheme: {{ if .Values.tls.enabled }}HTTPS{{- else }}HTTP{{- end }}
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: {{ include "port-name" . }}
              scheme: {{ if .Values.tls.enabled }}HTTPS{{- else }}HTTP{{- end }}
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: {{ include "port-name" . }}
              scheme: {{ if .Values.tls.enabled }}HTTPS{{- else }}HTTP{{- end }}
            timeoutSeconds: 5
            initialDelaySeconds: 5
          {{- with .Values.pod.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CROWDSEC_LAPI_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: lapi_url
            - name: CROWDSEC_LAPI_HTTP_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: lapi_http_timeout_seconds
            - name: BIND_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: bind_port
            - name: BIND_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: bind_host
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: log_level
            - name: METRICS_RETAIN_COUNTER_STARTUP_INCREMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: retain_counter_startup_increment
            - name: METRICS_COUNTER_MAX_COUNT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: counter_max_count
            - name: METRICS_COUNTER_MAX_AGE_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: counter_max_age_seconds
            - name: METRIC_SETS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "configmap-name" . }}
                  key: metric_sets
            - name: CROWDSEC_MACHINE_ID
              value: "file:/etc/prometheus-crowdsec-exporter/machine-credentials/username"
            - name: CROWDSEC_MACHINE_PASSWORD
              value: "file:/etc/prometheus-crowdsec-exporter/machine-credentials/password"
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT_FILE
              value: "/etc/prometheus-crowdsec-exporter/tls/tls.crt"
            - name: TLS_KEY_FILE
              value: "/etc/prometheus-crowdsec-exporter/tls/tls.key"
            {{- end }}

            {{- if .Values.auth.enabled }}
            {{- if .Values.auth.basic.enabled }}
            - name: AUTH_USERNAME
              value: "file:/etc/prometheus-crowdsec-exporter/auth/username"
            - name: AUTH_PASSWORD
              value: "file:/etc/prometheus-crowdsec-exporter/auth/password"
            {{- else if .Values.auth.token.enabled }}
            - name: AUTH_BEARER_TOKEN
              value: "file:/etc/prometheus-crowdsec-exporter/auth/token"
            {{- else }}
            {{- fail "If .auth.enabled is true, either .auth.basic.enabled or .auth.token.enabled must be true" -}}
            {{- end }}
            {{- end }}

            {{- with .Values.pod.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: machine-credentials
              mountPath: /etc/prometheus-crowdsec-exporter/machine-credentials
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls-secret
              mountPath: /etc/prometheus-crowdsec-exporter/tls
              readOnly: true
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: auth-secret
              mountPath: /etc/prometheus-crowdsec-exporter/auth
              readOnly: true
            {{- end }}
            {{- with .Values.pod.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: machine-credentials
          secret:
            secretName: {{ include "machine-credentials-secret-name" . }}
        {{- if .Values.tls.enabled }}
        - name: tls-secret
          secret:
            secretName: {{ include "tls-secret-name" . }}
        {{- end }}
        {{- if .Values.auth.enabled }}
        - name: auth-secret
          secret:
            secretName: {{ include "auth-secret-name" . }}
        {{- end }}
      {{- with .Values.pod.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pod.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
