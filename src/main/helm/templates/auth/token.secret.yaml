{{- if and .Values.auth.enabled .Values.auth.token.enabled -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-secret-name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
type: Opaque
stringData:
  token: {{ .Values.auth.token.value | quote }}

{{- end -}}
