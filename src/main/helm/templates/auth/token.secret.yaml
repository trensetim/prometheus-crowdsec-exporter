{{- if and .Values.auth.enabled .Values.auth.token.enabled .Values.auth.secret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-secret-name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
type: Opaque
stringData:
  {{- $token := "" }}
  {{- $old := lookup "v1" "Secret" .Release.Namespace (include "auth-secret-name" .) }}
  {{- if and ($old) ($old.data) ($old.data.token) }}
    {{- $token = $old.data.token | b64dec }}
  {{- end }}
  {{- $token = default (randAlphaNum 32) $token }}
  {{- $token = default $token .Values.auth.token.value }}
  token: {{ $token | quote }}
{{- end -}}
