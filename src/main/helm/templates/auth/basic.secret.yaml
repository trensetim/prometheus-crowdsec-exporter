{{- if and .Values.auth.enabled .Values.auth.basic.enabled .Values.auth.secret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-secret-name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
type: kubernetes.io/basic-auth
stringData:
  {{- $username := "" }}
  {{- $password := "" }}
  {{- $old := lookup "v1" "Secret" .Release.Namespace (include "auth-secret-name" .) }}
  {{- if and ($old) ($old.data) ($old.data.username) }}
    {{- $username = $old.data.username | b64dec }}
  {{- end }}
  {{- if and ($old) ($old.data) ($old.data.password) }}
    {{- $password = $old.data.password | b64dec }}
  {{- end }}
  {{- $username = default (include "name" .) $username }}
  {{- $password = default (randAlphaNum 32) $password }}
  {{- $username = default $username .Values.auth.basic.username }}
  {{- $password = default $password .Values.auth.basic.password }}
  username: {{ $username | quote }}
  password: {{ $password | quote }}
{{- end -}}
