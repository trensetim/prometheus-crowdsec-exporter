{{- if and .Values.auth.enabled .Values.auth.basic.enabled -}}

{{- if or (empty .Values.auth.basic.username) (empty .Values.auth.basic.password) -}}
{{- fail "Both auth.basic.username and auth.basic.password must be provided" -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-secret-name" . }}
  labels:
    {{- include "labels" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  annotations:
    {{- include "annotations" . | nindent 4 }}
    {{- range $key, $value := .Values.auth.secret.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.auth.basic.username | quote }}
  password: {{ .Values.auth.basic.password | quote }}

{{- end -}}
