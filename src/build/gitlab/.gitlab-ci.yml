services:
  - name: docker:dind

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.gitlab-ci-common-snippets:
  - &configure-python-setuptools-version |
    VERSION="${CI_COMMIT_TAG:-0.0.0}-${CI_COMMIT_SHORT_SHA}"
    echo "$VERSION" > src/main/python/version.txt
  - &common-helm--install-deps |
      apk add --no-cache curl yq
      curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sh
  - &common-helm--lint |
      helm lint src/main/helm
  - &common-helm--prepare-build-dir |
      mkdir -p build/

stages:
  - test
  - build_dev
  - release

unit_tests:
    stage: test
    image: python:3.14-slim
    tags:
      - docker
    services: []
    before_script: [] # override the global docker-login; not needed for unit tests
    script:
      - pip install --no-cache-dir -r src/main/python/requirements-dev.txt
      - pytest

build_dev_docker:
    tags:
      - docker
    stage: build_dev
    script:
      - *configure-python-setuptools-version

      - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH:dev -f src/build/docker/Dockerfile .
      - docker push $CI_REGISTRY/$CI_PROJECT_PATH:dev

release_docker:
    tags:
      - docker
    stage: release
    rules:
    - if: $CI_COMMIT_TAG =~ /release\/docker\/.+/
    script:
      - CI_COMMIT_TAG=${CI_COMMIT_TAG#release/docker/}

      - *configure-python-setuptools-version

      - docker build -t $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_TAG --build-arg VERSION=$CI_COMMIT_TAG -f src/build/docker/Dockerfile .
      - docker push $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_TAG

      - docker tag $CI_REGISTRY/$CI_PROJECT_PATH:$CI_COMMIT_TAG $CI_REGISTRY/$CI_PROJECT_PATH:latest
      - docker push $CI_REGISTRY/$CI_PROJECT_PATH:latest

build_dev_helm:
    tags:
      - docker
    stage: build_dev
    script:
      - *common-helm--install-deps
      - *common-helm--lint
      - *common-helm--prepare-build-dir

      # add suffix to version to distinguish from release tags
      - export VERSION="$(yq -r '.version' <src/main/helm/Chart.yaml)-dev"
      - echo "Building version $VERSION"
      - helm package src/main/helm --version "$VERSION" --destination build/
      - helm push ./build/*.tgz oci://$CI_REGISTRY/$CI_PROJECT_PATH/helm

release_helm:
    tags:
      - docker
    stage: release
    rules:
    - if: $CI_COMMIT_TAG =~ /release\/helm\/.+/
    script:
      - *common-helm--install-deps
      - *common-helm--lint
      - *common-helm--prepare-build-dir
      - CI_COMMIT_TAG=${CI_COMMIT_TAG#release/helm/}
      - echo "Building version $CI_COMMIT_TAG"
      - helm package src/main/helm --version $CI_COMMIT_TAG --destination build/
      - helm push ./build/*.tgz oci://$CI_REGISTRY/$CI_PROJECT_PATH/helm
