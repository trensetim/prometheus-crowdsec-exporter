global:
  scrape_interval:     15s   # how often to pull /metrics
  evaluation_interval: 15s

scrape_configs:
  - job_name: "crowdsec-exporter"
    static_configs:
      - targets: ["exporter:8000"]
    # Optional: label all metrics from this job with env=dev
    relabel_configs:
      - target_label: env
        replacement: dev
